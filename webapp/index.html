<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chess Engine — Play</title>
<style>
  :root {
    --light: #eeeed2;
    --dark: #769656;
    --sel: rgba(255,255,51,0.5);
    --last: rgba(255,255,51,0.42);
    --dot: rgba(20,40,10,0.22);
    --ring: rgba(20,40,10,0.20);
    --check: radial-gradient(circle, #ff6b6b 0%, #e33 70%, rgba(230,60,60,0) 72%);
    --bg0: #262421;
    --bg1: #302e2b;
    --panel: #302e2b;
    --panel2: #272522;
    --line: #3d3a37;
    --text: #e9e7e2;
    --muted: #9a958d;
    --accent: #81b64c;
    --accent-d: #6a9a3d;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg0); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100%;
  }
  header { padding: 12px 18px 8px; text-align: center; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  .app { flex: 1; display: flex; gap: 20px; padding: 8px 18px 22px;
         align-items: flex-start; justify-content: center; }

  /* ---- Board column ----
     The column takes the space left over after the fixed-width panel and can
     shrink (min-width:0), so the board never pushes the panel off-screen.
     --bsize keeps the board and the captured bars exactly the same width. */
  .board-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
               align-items: center; gap: 8px;
               --bsize: min(100%, calc(100dvh - 150px), 720px); }
  .board {
    position: relative;
    width: var(--bsize);
    aspect-ratio: 1 / 1;
    display: grid; grid-template-columns: repeat(8, 1fr);
    border-radius: 4px; overflow: hidden;
    box-shadow: 0 10px 34px rgba(0,0,0,.45);
    touch-action: manipulation; user-select: none;
  }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; }
  .sq.light { background: var(--light); }
  .sq.dark  { background: var(--dark); }
  .sq.hint { cursor: pointer; }
  .sq.sel::after { content:""; position:absolute; inset:0; background: var(--sel); }
  .sq.last::before { content:""; position:absolute; inset:0; background: var(--last); }
  .sq.check::after { content:""; position:absolute; inset:0; background: var(--check); z-index: 0; }
  .piece { position: relative; z-index: 2; width: 92%; height: 92%; pointer-events: none;
           -webkit-user-drag: none; user-select: none; }
  .dot { position: absolute; z-index: 1; width: 32%; height: 32%; border-radius: 50%; background: var(--dot); }
  .dot.capture { width: 92%; height: 92%; background: transparent; border-radius: 50%;
                 border: 7px solid var(--ring); box-sizing: border-box; }
  .coord { position: absolute; font-size: clamp(8px, 1.4vw, 12px); font-weight: 700; z-index: 3; }
  .coord.file { right: 4px; bottom: 2px; }
  .coord.rank { left: 3px; top: 1px; }
  .sq.light .coord { color: var(--dark); }
  .sq.dark .coord { color: var(--light); }

  .banner { position: absolute; inset: 0; z-index: 6; display: none;
            align-items: center; justify-content: center; flex-direction: column;
            background: rgba(20,20,18,.74); text-align: center; padding: 20px; }
  .banner.show { display: flex; }
  .banner .big { font-size: 26px; font-weight: 750; }
  .banner .small { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .banner button { margin-top: 16px; min-width: 160px; }

  .cap { width: var(--bsize); display: flex; align-items: center; gap: 8px; min-height: 30px;
         padding: 3px 10px; border-radius: 6px; background: var(--bg1); }
  .cap .who { font-size: 10px; color: var(--muted); text-transform: uppercase;
              letter-spacing: .5px; font-weight: 700; width: 42px; }
  .cap .pcs { display: flex; align-items: center; }
  .cap .pcs img { width: 19px; height: 19px; margin-right: -5px; }
  .cap .adv { margin-left: auto; font-size: 12px; color: var(--accent); font-weight: 700; }

  /* ---- Panel ---- */
  .panel { width: 320px; background: var(--panel); border-radius: 10px; padding: 14px;
           display: flex; flex-direction: column; gap: 12px; align-self: flex-start;
           max-height: calc(100dvh - 90px); }
  .turn { display: flex; align-items: center; gap: 10px; }
  .turn .swatch { width: 15px; height: 15px; border-radius: 50%; background: #fff;
                  box-shadow: 0 0 0 2px #000, 0 1px 3px rgba(0,0,0,.5); }
  .turn.black .swatch { background: #3b3936; box-shadow: 0 0 0 2px #000; }
  .turn .label { font-size: 15.5px; font-weight: 650; }
  .turn .chk { color: #ff7a6b; font-weight: 700; font-size: 12.5px; margin-left: auto; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { background: var(--panel2); border-radius: 20px; padding: 3px 9px; font-size: 11px; color: var(--muted); }
  .badge.hl { color: #cfe6ad; }
  .notice { font-size: 12px; color: #f0c674; }
  .notice:empty, .err:empty { display: none; }
  .err { color: #ff9c8f; font-size: 12px; }

  .moves-wrap { border-radius: 8px; overflow: hidden; background: var(--panel2); display: flex; flex-direction: column; min-height: 120px; }
  .moves-head { padding: 7px 12px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .moves { overflow-y: auto; flex: 1; max-height: 230px; }
  .moves table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .moves td { padding: 4px 10px; }
  .moves td.n { color: var(--muted); width: 34px; text-align: right; user-select: none; }
  .moves tr:nth-child(odd) { background: rgba(255,255,255,.03); }
  .moves .empty { padding: 14px; color: var(--muted); font-size: 12px; text-align: center; }

  .promo { display: none; grid-template-columns: repeat(4,1fr); gap: 6px; padding: 8px;
           background: var(--panel2); border-radius: 8px; }
  .promo.active { display: grid; }
  .promo .pl { font-size: 11px; color: var(--muted); grid-column: 1/-1; }
  .promo button { padding: 4px; }
  .promo img { width: 100%; height: auto; display: block; }

  .row { display: flex; gap: 8px; }
  .section-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 2px 0 -4px; }
  button { background: #3d3a37; color: var(--text); border: none; border-radius: 8px;
           padding: 9px 12px; font-size: 13px; cursor: pointer; flex: 1; font-weight: 600;
           transition: background .12s; }
  button:hover:not(:disabled) { background: #494540; }
  button.primary { background: var(--accent); color: #17240a; }
  button.primary:hover:not(:disabled) { background: #8fc659; }
  button.toggle.on { background: var(--accent); color: #17240a; }
  button:disabled { opacity: .4; cursor: default; }
  .hint-text { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  @media (max-width: 900px) {
    .app { flex-direction: column; align-items: center; }
    .board-col { flex: 0 0 auto; width: 100%; --bsize: min(94vw, calc(100dvh - 300px)); }
    .panel { width: min(94vw, 420px); max-height: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>♟ Chess Engine — live test board</h1>
    <p>Every move drives the real Python engine (FIDE rules).</p>
  </header>

  <div class="app">
    <div class="board-col">
      <div class="cap" id="capTop"></div>
      <div class="board" id="board">
        <div class="banner" id="banner">
          <div class="big" id="bannerBig"></div>
          <div class="small" id="bannerSmall"></div>
          <button class="primary" id="bannerNew">New game</button>
        </div>
      </div>
      <div class="cap" id="capBot"></div>
    </div>

    <div class="panel">
      <div class="turn" id="turn">
        <span class="swatch"></span>
        <span class="label" id="turnLabel">White to move</span>
        <span class="chk" id="chk"></span>
      </div>
      <div class="meta" id="meta"></div>
      <div class="notice" id="notice"></div>
      <div class="err" id="err"></div>

      <div class="promo" id="promo"></div>

      <div class="moves-wrap">
        <div class="moves-head">Moves</div>
        <div class="moves" id="moves"><div class="empty">No moves yet</div></div>
      </div>

      <div class="section-label">Game</div>
      <div class="row">
        <button id="newGame" class="primary">New game</button>
        <button id="flip">Flip</button>
        <button id="hints" class="toggle">Hints</button>
      </div>
      <div class="row"><button id="resign">Resign</button></div>

      <div class="section-label">Draws</div>
      <div class="row">
        <button id="claim3" disabled>Claim 3-fold</button>
        <button id="claim50" disabled>Claim 50-move</button>
      </div>
      <div class="row">
        <button id="offer">Offer draw</button>
        <button id="accept" disabled>Accept</button>
        <button id="decline" disabled>Decline</button>
      </div>
      <div class="hint-text">Click a piece, then a target square. Toggle <b>Hints</b> to show/hide legal-move dots.</div>
    </div>
  </div>

<script>
const VAL = { p:1, n:3, b:3, r:5, q:9 };
const FILES = "abcdefgh";
let state = null, selected = null, flipped = false, pendingPromo = null;
let showHints = (localStorage.getItem("chessHints") ?? "1") === "1";

const $ = id => document.getElementById(id);
const boardEl = $("board");

const pieceKey = c => (c === c.toUpperCase() ? "w" : "b") + c.toUpperCase();
function pieceImg(c, cls) {
  const img = document.createElement("img");
  img.className = cls || "piece"; img.src = "/pieces/" + pieceKey(c) + ".svg";
  img.alt = ""; img.draggable = false;
  return img;
}
function sqName(f, r) { return FILES[f] + (r + 1); }
function idxOf(f, r) { return r * 8 + f; }

async function api(path, body) {
  const opt = { method: body ? "POST" : "GET" };
  if (body) { opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
  return (await fetch(path, opt)).json();
}

function legalTargetsFrom(from) {
  const map = {};
  for (const uci of state.legal)
    if (uci.slice(0, 2) === from) { const to = uci.slice(2, 4); map[to] = map[to] || uci.length > 4; }
  return map;
}

function render() {
  const banner = $("banner");
  [...boardEl.querySelectorAll(".sq")].forEach(n => n.remove());
  const targets = selected ? legalTargetsFrom(selected) : {};
  const ranks = flipped ? [...Array(8).keys()] : [...Array(8).keys()].reverse();
  const files = flipped ? [...Array(8).keys()].reverse() : [...Array(8).keys()];
  for (const r of ranks) for (const f of files) {
    const name = sqName(f, r);
    const piece = state.board[idxOf(f, r)];
    const el = document.createElement("div");
    el.className = "sq " + ((f + r) % 2 === 0 ? "dark" : "light");
    if (selected === name) el.classList.add("sel");
    if (state.last_move && (state.last_move.frm === name || state.last_move.to === name)) el.classList.add("last");
    if (state.check_square === name) el.classList.add("check");
    if (!state.over && state.legal.some(u => u.slice(0,2) === name)) el.classList.add("hint");

    if (f === (flipped ? 7 : 0)) { const c = document.createElement("span"); c.className="coord rank"; c.textContent = r+1; el.appendChild(c); }
    if (r === (flipped ? 7 : 0)) { const c = document.createElement("span"); c.className="coord file"; c.textContent = FILES[f]; el.appendChild(c); }
    if (showHints && (name in targets)) { const d = document.createElement("div"); d.className = "dot" + (piece ? " capture" : ""); el.appendChild(d); }
    if (piece) el.appendChild(pieceImg(piece));
    el.addEventListener("click", () => onSquare(name));
    boardEl.appendChild(el);
  }
  boardEl.appendChild(banner);
}

function captured() {
  const start = { P:8,N:2,B:2,R:2,Q:1, p:8,n:2,b:2,r:2,q:1 };
  const cur = {};
  for (const pc of state.board) if (pc) cur[pc] = (cur[pc]||0)+1;
  const missing = c => Math.max(0, (start[c]||0) - (cur[c]||0));
  const byWhite = [], byBlack = []; let sW = 0, sB = 0;
  for (const k of ["q","r","b","n","p"]) {
    for (let i=0;i<missing(k);i++){ byWhite.push(k); sW += VAL[k]; }
    for (let i=0;i<missing(k.toUpperCase());i++){ byBlack.push(k.toUpperCase()); sB += VAL[k]; }
  }
  return { byWhite, byBlack, adv: sW - sB };
}
function renderCaptured() {
  const c = captured();
  const mk = arr => arr.map(k => `<img src="/pieces/${pieceKey(k)}.svg" alt="">`).join("");
  const bottomWhite = !flipped;
  const capByBottom = bottomWhite ? c.byWhite : c.byBlack;
  const capByTop    = bottomWhite ? c.byBlack : c.byWhite;
  const topName    = bottomWhite ? "Black" : "White";
  const bottomName = bottomWhite ? "White" : "Black";
  const bottomAdv = bottomWhite ? c.adv : -c.adv;
  $("capTop").innerHTML = `<span class="who">${topName}</span><span class="pcs">${mk(capByTop)}</span>` + (bottomAdv < 0 ? `<span class="adv">+${-bottomAdv}</span>` : "");
  $("capBot").innerHTML = `<span class="who">${bottomName}</span><span class="pcs">${mk(capByBottom)}</span>` + (bottomAdv > 0 ? `<span class="adv">+${bottomAdv}</span>` : "");
}

function renderMoves() {
  const h = state.history || [];
  const box = $("moves");
  if (!h.length) { box.innerHTML = '<div class="empty">No moves yet</div>'; return; }
  let rows = "";
  for (let i = 0; i < h.length; i += 2)
    rows += `<tr><td class="n">${i/2+1}.</td><td>${h[i]||""}</td><td>${h[i+1]||""}</td></tr>`;
  box.innerHTML = `<table>${rows}</table>`;
  box.scrollTop = box.scrollHeight;
}

function renderPromo() {
  const p = $("promo");
  p.innerHTML = "";
  if (!pendingPromo) { p.classList.remove("active"); return; }
  const white = state.side_to_move === "w";
  const label = document.createElement("div"); label.className = "pl"; label.textContent = "Promote to:"; p.appendChild(label);
  for (const k of ["q","r","b","n"]) {
    const btn = document.createElement("button");
    btn.appendChild(pieceImg(white ? k.toUpperCase() : k, "promo-img"));
    btn.querySelector("img").className = "";
    btn.addEventListener("click", async () => {
      const uci = pendingPromo.from + pendingPromo.to + k;
      pendingPromo = null; renderPromo();
      setState(await api("/api/move", { uci }));
    });
    p.appendChild(btn);
  }
  p.classList.add("active");
}

function updatePanel() {
  const s = state;
  $("turn").classList.toggle("black", s.side_to_move === "b");
  $("turnLabel").textContent = s.over ? "Game over" : (s.side_to_move === "w" ? "White to move" : "Black to move");
  $("chk").textContent = (!s.over && s.in_check) ? "CHECK" : "";

  const b = [];
  if (s.category) b.push(`<span class="badge ${s.category!=='ongoing'?'hl':''}">${s.category.replace(/_/g,' ')}</span>`);
  b.push(`<span class="badge">move ${s.fullmove}</span>`, `<span class="badge">50-mv ${s.halfmove_clock}/100</span>`, `<span class="badge">reps ${s.repetition_count}</span>`);
  $("meta").innerHTML = b.join("");

  let notice = "";
  if (s.claimable && s.claimable.length) notice += `Claimable: ${s.claimable.map(x=>x.replace(/_/g,' ')).join(", ")}. `;
  if (s.pending_draw_offer) notice += `Draw offered by ${s.pending_draw_offer==='w'?'White':'Black'}.`;
  $("notice").textContent = notice;

  $("claim3").disabled = !(s.claimable||[]).includes("threefold_repetition");
  $("claim50").disabled = !(s.claimable||[]).includes("fifty_move");
  $("accept").disabled = !s.pending_draw_offer || s.over;
  $("decline").disabled = !s.pending_draw_offer || s.over;
  $("resign").disabled = s.over;
  $("offer").disabled = s.over;

  const banner = $("banner");
  if (s.over) {
    const term = (s.termination||"").replace(/_/g," ");
    let big = "Draw"; if (s.result === "1-0") big = "White wins"; else if (s.result === "0-1") big = "Black wins";
    $("bannerBig").textContent = big + (s.result==="1/2-1/2" ? "" : " • " + s.result);
    $("bannerSmall").textContent = "by " + term;
    banner.classList.add("show");
  } else banner.classList.remove("show");
}

function setState(s) {
  $("err").textContent = s.error || "";
  state = s;
  render(); renderCaptured(); renderMoves(); updatePanel();
}

function onSquare(name) {
  $("err").textContent = "";
  if (state.over || pendingPromo) return;
  if (selected) {
    const targets = legalTargetsFrom(selected);
    if (name in targets) {
      if (targets[name]) { pendingPromo = { from: selected, to: name }; selected = null; render(); renderPromo(); return; }
      const uci = selected + name; selected = null;
      api("/api/move", { uci }).then(setState);
      return;
    }
  }
  selected = state.legal.some(u => u.slice(0,2) === name) ? name : null;
  render();
}

function syncHintsBtn() { $("hints").classList.toggle("on", showHints); $("hints").textContent = showHints ? "Hints ✓" : "Hints"; }

$("newGame").addEventListener("click", async () => { selected=null; pendingPromo=null; renderPromo(); setState(await api("/api/new", {})); });
$("bannerNew").addEventListener("click", async () => { selected=null; setState(await api("/api/new", {})); });
$("flip").addEventListener("click", () => { flipped = !flipped; render(); renderCaptured(); });
$("hints").addEventListener("click", () => { showHints = !showHints; localStorage.setItem("chessHints", showHints ? "1":"0"); syncHintsBtn(); render(); });
$("resign").addEventListener("click", async () => setState(await api("/api/resign", { color: state.side_to_move })));
$("claim3").addEventListener("click", async () => setState(await api("/api/claim", { reason: "threefold_repetition" })));
$("claim50").addEventListener("click", async () => setState(await api("/api/claim", { reason: "fifty_move" })));
$("offer").addEventListener("click", async () => setState(await api("/api/offer", { color: state.side_to_move })));
$("accept").addEventListener("click", async () => setState(await api("/api/offer/accept", {})));
$("decline").addEventListener("click", async () => setState(await api("/api/offer/decline", {})));

syncHintsBtn();
(async () => setState(await api("/api/state")))();
</script>
</body>
</html>
